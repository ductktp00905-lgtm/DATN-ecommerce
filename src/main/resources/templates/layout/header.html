<header xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        th:fragment="header"
        class="navbar">
    <div class="container nav-container">
        <!-- Logo FlareHub -->
        <a th:href="@{/products}" class="brand" aria-label="FlareHub Trang chủ">
            <span class="brand-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2C8.5 7 6 9.5 6 13a6 6 0 0 0 12 0c0-3.5-2.5-6-6-11zm0 16a4 4 0 0 1-4-4c0-1.8 1.2-3.6 2.8-5.3.3.8.8 1.6 1.4 2.2.4.4.8.7 1.3 1 0 0 .5.3.5.8a2 2 0 0 1-2 2z"/>
                </svg>
            </span>
            <span class="brand-text">
                <span class="brand-title">Flare<span>Hub</span></span>
                <span class="brand-slogan">Công nghệ bừng sáng</span>
            </span>
        </a>

        <!-- Thanh tìm kiếm nhanh sản phẩm -->
        <div class="nav-search">
            <form th:action="@{/products}" method="get" class="nav-search-form" role="search">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       class="nav-search-input"
                       placeholder="Tìm điện thoại, laptop, phụ kiện..."
                       aria-label="Tìm kiếm sản phẩm">
                <button type="submit" class="nav-search-btn" aria-label="Tìm kiếm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Nút toggle mobile -->
        <button id="mobile-nav-toggle" class="mobile-toggle" aria-label="Mở menu điều hướng" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- Menu điều hướng -->
        <nav id="nav-menu-wrapper" class="nav-menu">
            <a th:href="@{/products}" class="nav-item">
                <span>📱 Sản phẩm</span>
            </a>

            <!-- Dành riêng cho ADMIN -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="nav-item admin-badge">
                <span>⚡ Dashboard Admin</span>
            </a>

            <!-- Đã đăng nhập -->
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/cart}" class="nav-item cart-badge-wrap">
                    <span>🛒 Giỏ hàng</span>
                    <span class="cart-count"
                          th:text="${session.cart != null and session.cart.items != null ? session.cart.items.size() : 0}">0</span>
                </a>
                <a th:href="@{/orders/history}" class="nav-item">
                    <span>📦 Đơn hàng</span>
                </a>
                <a th:href="@{/wishlist}" class="nav-item">
                    <span>❤️ Yêu thích</span>
                </a>
                <a th:href="@{/profile}" class="nav-item">
                    <span>👤 Tài khoản</span>
                </a>

                <!-- Thông tin người dùng & Đăng xuất -->
                <div class="nav-user">
                    <span class="user-tag">
                        Chào, <b sec:authentication="name"></b>
                        <span class="user-role-badge" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                        <span class="user-role-badge" sec:authorize="hasRole('CUSTOMER')">CUSTOMER</span>
                    </span>
                    <form th:action="@{/auth/logout}" method="post" class="logout-form">
                        <button type="submit" class="btn-logout" aria-label="Đăng xuất khỏi hệ thống">Đăng xuất</button>
                    </form>
                </div>
            </th:block>

            <!-- Chưa đăng nhập -->
            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="nav-item">Đăng nhập</a>
                <a th:href="@{/auth/register}" class="btn btn-primary btn-sm">Đăng ký</a>
            </th:block>
        </nav>
    </div>
</header>
