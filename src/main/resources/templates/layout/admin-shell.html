<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Thanh tiêu đề kiểu macOS -->
<div th:fragment="titlebar" class="titlebar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="title">FlareHub — Admin</div>
    <!-- Khi trang được mở trong cửa sổ của desktop (iframe) thì ẩn khung ngoài, chỉ giữ phần nội dung -->
    <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
</div>

<!-- Thanh bên; active = dashboard | products | categories | orders | users | reset -->
<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="label">QUẢN TRỊ</div>
    <nav class="nav">
        <a th:href="@{/admin/dashboard}"><span class="ico" style="background:#5856d6">❖</span><span class="t">Màn hình chính</span></a>
        <a th:href="@{/admin/overview}" th:classappend="${active == 'overview'} ? 'active'"><span class="ico" style="background:#007aff">▦</span><span class="t">Tổng quan</span></a>
        <a th:href="@{/admin/products}" th:classappend="${active == 'products'} ? 'active'"><span class="ico" style="background:#ff9500">▣</span><span class="t">Sản phẩm</span></a>
        <a th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'active'"><span class="ico" style="background:#af52de">☰</span><span class="t">Danh mục</span></a>
        <a th:href="@{/admin/orders}" th:classappend="${active == 'orders'} ? 'active'"><span class="ico" style="background:#34c759">✓</span><span class="t">Đơn hàng</span></a>
                <a th:href="@{/admin/vouchers}" th:classappend="${active == 'vouchers'} ? 'active'"><span class="ico" style="background:#ff9500">%</span><span class="t">Voucher</span></a>
        <a th:href="@{/admin/best-sellers}" th:classappend="${active == 'bestsellers'} ? 'active'"><span class="ico" style="background:#ff2d55">★</span><span class="t">Bán chạy</span></a>
        <a th:href="@{/admin/inventory}" th:classappend="${active == 'inventory'} ? 'active'"><span class="ico" style="background:#5856d6">▦</span><span class="t">Tồn kho</span></a>
        <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'active'"><span class="ico" style="background:#5ac8fa">☺</span><span class="t">Người dùng</span></a>
        <a th:href="@{/admin/reviews}" th:classappend="${active == 'reviews'} ? 'active'"><span class="ico" style="background:#ffcc00">✎</span><span class="t">Đánh giá</span></a>
    </nav>
    <div class="label">KHÁC</div>
    <nav class="nav">
        <a th:href="@{/products}"><span class="ico" style="background:#8e8e93">⌂</span><span class="t">Xem cửa hàng</span></a>
        <a class="danger" th:href="@{/admin/system/reset}" th:classappend="${active == 'reset'} ? 'active'"><span class="ico" style="background:#ff3b30">!</span><span class="t">Reset dữ liệu</span></a>
    </nav>
    <div class="spacer"></div>
    <div class="user">
        <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name,0,1))}">A</div>
        <div>
            <b th:text="${#authentication.name}">admin</b>
            <small><form th:action="@{/auth/logout}" method="post" style="display:inline"><button type="submit" class="logout" style="background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline">Đăng xuất</button></form></small>
        </div>
    </div>
</aside>

</body>
</html>
