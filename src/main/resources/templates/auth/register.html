<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký tài khoản — FlareHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="main-content">
        <div class="auth-page">
            <div class="auth-card" style="max-width: 460px;">
                <div class="auth-header">
                    <a th:href="@{/products}" class="brand auth-brand" style="justify-content: center;">
                        <span class="brand-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 2C8.5 7 6 9.5 6 13a6 6 0 0 0 12 0c0-3.5-2.5-6-6-11zm0 16a4 4 0 0 1-4-4c0-1.8 1.2-3.6 2.8-5.3.3.8.8 1.6 1.4 2.2.4.4.8.7 1.3 1 0 0 .5.3.5.8a2 2 0 0 1-2 2z"/>
                            </svg>
                        </span>
                        <span class="brand-text">
                            <span class="brand-title">Flare<span>Hub</span></span>
                        </span>
                    </a>
                    <h2>Đăng ký tài khoản mới</h2>
                    <p>Khám phá thế giới công nghệ cùng FlareHub</p>
                </div>

                <!-- Thông báo lỗi chung từ controller -->
                <div th:if="${errorMessage}" class="alert alert-error" role="alert">
                    <span th:text="${errorMessage}"></span>
                </div>

                <!-- Form đăng ký -->
                <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
                    <div class="form-group">
                        <label for="username">Tên đăng nhập *</label>
                        <input type="text"
                               id="username"
                               th:field="*{username}"
                               autocomplete="username"
                               placeholder="VD: nguyenvanan">
                        <span th:if="${#fields.hasErrors('username')}"
                              th:errors="*{username}"
                              class="alert alert-error"
                              style="margin-top: 6px; padding: 6px 12px; font-size: 0.82rem;"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Mật khẩu *</label>
                        <input type="password"
                               id="password"
                               type="password"
                               th:field="*{password}"
                               autocomplete="new-password"
                               placeholder="Ít nhất 6 ký tự">
                        <span th:if="${#fields.hasErrors('password')}"
                              th:errors="*{password}"
                              class="alert alert-error"
                              style="margin-top: 6px; padding: 6px 12px; font-size: 0.82rem;"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Địa chỉ Email *</label>
                        <input type="email"
                               id="email"
                               type="email"
                               th:field="*{email}"
                               autocomplete="email"
                               placeholder="VD: an.nguyen@example.com">
                        <span th:if="${#fields.hasErrors('email')}"
                              th:errors="*{email}"
                              class="alert alert-error"
                              style="margin-top: 6px; padding: 6px 12px; font-size: 0.82rem;"></span>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Họ và tên</label>
                        <input type="text"
                               id="fullName"
                               th:field="*{fullName}"
                               placeholder="VD: Nguyễn Văn An">
                    </div>

                    <div class="form-group">
                        <label for="phone">Số điện thoại</label>
                        <input type="text"
                               id="phone"
                               th:field="*{phone}"
                               placeholder="VD: 0912345678">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 12px;">
                        <span>Tạo tài khoản FlareHub</span>
                    </button>
                </form>

                <div class="switch-link">
                    Đã có tài khoản FlareHub?
                    <a th:href="@{/auth/login}">Đăng nhập</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
