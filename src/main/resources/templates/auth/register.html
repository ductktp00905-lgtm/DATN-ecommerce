<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card" style="max-width:440px">
            <h2>Đăng ký tài khoản</h2>

            <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert-error"></p>

            <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" th:field="*{username}">
                    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="alert-error" style="display:block; margin-top:4px; padding:6px 10px"></span>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" th:field="*{password}">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="alert-error" style="display:block; margin-top:4px; padding:6px 10px"></span>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="alert-error" style="display:block; margin-top:4px; padding:6px 10px"></span>
                </div>
                <div class="form-group">
                    <label>Họ tên</label>
                    <input type="text" th:field="*{fullName}">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" th:field="*{phone}">
                </div>
                <button type="submit">Đăng ký</button>
            </form>

            <div class="switch-link">
                Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a>
            </div>
        </div>
    </div>
</body>
</html>
