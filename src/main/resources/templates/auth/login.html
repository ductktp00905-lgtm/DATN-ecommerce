<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h2>Đăng nhập</h2>

            <p th:if="${param.registered}" class="alert-success">Đăng ký thành công, mời đăng nhập.</p>
            <p th:if="${param.error}" class="alert-error">Sai tên đăng nhập hoặc mật khẩu.</p>

            <form th:action="@{/auth/login}" method="post">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Đăng nhập</button>
            </form>

            <div class="switch-link">
                Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
