<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập — FlareHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="main-content">
        <div class="auth-page">
            <div class="auth-card">
                <div class="auth-header">
                    <a th:href="@{/products}" class="brand auth-brand" style="justify-content: center;">
                        <span class="brand-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 2C8.5 7 6 9.5 6 13a6 6 0 0 0 12 0c0-3.5-2.5-6-6-11zm0 16a4 4 0 0 1-4-4c0-1.8 1.2-3.6 2.8-5.3.3.8.8 1.6 1.4 2.2.4.4.8.7 1.3 1 0 0 .5.3.5.8a2 2 0 0 1-2 2z"/>
                            </svg>
                        </span>
                        <span class="brand-text">
                            <span class="brand-title">Flare<span>Hub</span></span>
                        </span>
                    </a>
                    <h2>Đăng nhập tài khoản</h2>
                    <p>Chào mừng bạn trở lại với cửa hàng FlareHub</p>
                </div>

                <!-- Thông báo trạng thái qua URL param -->
                <div th:if="${param.registered}" class="alert alert-success" role="alert">
                    <span>✅ Đăng ký tài khoản thành công! Mời bạn đăng nhập.</span>
                </div>
                <div th:if="${param.locked}" class="alert alert-error" role="alert">
                    <span>🔒 Tài khoản của bạn đang bị tạm khóa. Vui lòng liên hệ quản trị viên.</span>
                </div>
                <div th:if="${param.error}" class="alert alert-error" role="alert">
                    <span>❌ Tên đăng nhập hoặc mật khẩu không chính xác.</span>
                </div>

                <!-- Form đăng nhập -->
                <form th:action="@{/auth/login}" method="post">
                    <div class="form-group">
                        <label for="username">Tên đăng nhập</label>
                        <input type="text"
                               id="username"
                               name="username"
                               required
                               autocomplete="username"
                               placeholder="Nhập tên đăng nhập của bạn">
                    </div>

                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password"
                               id="password"
                               name="password"
                               required
                               autocomplete="current-password"
                               placeholder="Nhập mật khẩu">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                        <span>Đăng nhập</span>
                    </button>
                </form>

                <div class="switch-link">
                    Chưa có tài khoản FlareHub?
                    <a th:href="@{/auth/register}">Đăng ký ngay</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
