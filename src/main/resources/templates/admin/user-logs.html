<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhật ký quản trị — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('users')}"></aside>
        
        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Nhật ký thao tác quản trị</h1>
                    <div class="sub">Lưu vết tất cả hành động cập nhật, khóa, đổi quyền và xóa người dùng của các Admin</div>
                </div>
                <a class="btn btn-plain" th:href="@{/admin/users}">← Quay lại Quản lý người dùng</a>
            </div>

            <section class="panel">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 60px;">ID</th>
                                <th>Thời gian</th>
                                <th>Admin thực hiện</th>
                                <th>Hành động</th>
                                <th>Đối tượng tác động</th>
                                <th>Ghi chú / Lý do</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="l : ${logs}">
                                <td th:text="'#' + ${l.logID}">#1</td>
                                <td th:text="${#temporals.format(l.createdDate, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026</td>
                                <td><strong style="color: var(--accent);" th:text="${l.adminUsername}">admin</strong></td>
                                <td><span class="badge" style="background: var(--hover);" th:text="${l.action}">UPDATE</span></td>
                                <td th:text="${l.targetUsername}">user</td>
                                <td th:text="${l.detail}">Chi tiết</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="6" class="empty">Chưa có nhật ký quản trị nào được ghi lại</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
