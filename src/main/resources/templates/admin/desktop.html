<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Màn hình chính</title>
    <style>
        :root {
            color-scheme: light dark;
            --wall:
                radial-gradient(circle at 18% 22%, #ffb86b 0, transparent 38%),
                radial-gradient(circle at 80% 18%, #ff6fa5 0, transparent 40%),
                radial-gradient(circle at 70% 85%, #6a7bff 0, transparent 45%),
                radial-gradient(circle at 15% 85%, #38c6d9 0, transparent 40%),
                #7a5cff;
            --menubar: rgba(255, 255, 255, 0.28);
            --menutext: #111;
            --window: rgba(246, 246, 248, 0.86);
            --bar: rgba(236, 236, 240, 0.9);
            --line: rgba(0, 0, 0, 0.12);
            --text: #1d1d1f;
            --dock: rgba(255, 255, 255, 0.32);
            --dockline: rgba(255, 255, 255, 0.5);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --wall:
                    radial-gradient(circle at 18% 22%, #7a3d8f 0, transparent 40%),
                    radial-gradient(circle at 82% 16%, #c2416b 0, transparent 40%),
                    radial-gradient(circle at 72% 86%, #2a3f9e 0, transparent 46%),
                    radial-gradient(circle at 14% 86%, #0f6c80 0, transparent 40%),
                    #1a1438;
                --menubar: rgba(20, 20, 24, 0.4);
                --menutext: #f5f5f7;
                --window: rgba(40, 40, 44, 0.88);
                --bar: rgba(52, 52, 58, 0.92);
                --line: rgba(255, 255, 255, 0.12);
                --text: #f5f5f7;
                --dock: rgba(40, 40, 46, 0.4);
                --dockline: rgba(255, 255, 255, 0.18);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background: var(--wall) fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        a { color: inherit; text-decoration: none; }

        /* ---- Thanh menu ---- */
        .menubar {
            position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 9500;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 14px; color: var(--menutext);
            background: var(--menubar);
            backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
            font-size: 13px;
        }
        .menubar .left, .menubar .right { display: flex; align-items: center; gap: 18px; }
        .menubar .logo { font-size: 15px; }
        .menubar .appname { font-weight: 700; }
        .menubar a:hover { opacity: .65; }

        /* ---- Cửa sổ ---- */
        #desktop { position: fixed; inset: 28px 0 0 0; }
        .win {
            position: absolute; display: flex; flex-direction: column;
            min-width: 360px; min-height: 240px;
            background: var(--window);
            backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 0 0.5px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.28);
            transform-origin: 50% 100%;
            animation: pop .22s cubic-bezier(.2, .9, .3, 1.2);
            transition: opacity .2s, transform .25s;
        }
        .win.focused { box-shadow: 0 0 0 0.5px rgba(0,0,0,.45), 0 24px 64px rgba(0,0,0,.45); }
        .win.closing { opacity: 0; transform: scale(.94); }
        .win.min { opacity: 0; transform: translateY(40vh) scale(.2); pointer-events: none; }
        .win.max { inset: 0 0 0 0 !important; width: auto !important; height: auto !important; border-radius: 0; }
        @keyframes pop { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: scale(1); } }

        .win-bar {
            height: 38px; flex-shrink: 0; display: flex; align-items: center;
            background: var(--bar); border-bottom: 1px solid var(--line);
            padding: 0 12px; position: relative; cursor: default;
        }
        .lights { display: flex; gap: 8px; z-index: 1; }
        .lights b {
            width: 12px; height: 12px; border-radius: 50%; display: block; cursor: pointer;
            border: 0.5px solid rgba(0,0,0,.2); position: relative;
        }
        .lights b:nth-child(1) { background: #ff5f57; }
        .lights b:nth-child(2) { background: #febc2e; }
        .lights b:nth-child(3) { background: #28c840; }
        .lights:hover b::after {
            position: absolute; inset: 0; display: grid; place-items: center;
            font-size: 9px; line-height: 12px; text-align: center; color: rgba(0,0,0,.6); font-weight: 800;
        }
        .lights:hover b:nth-child(1)::after { content: "×"; }
        .lights:hover b:nth-child(2)::after { content: "–"; }
        .lights:hover b:nth-child(3)::after { content: "+"; }
        .win:not(.focused) .lights b { background: #8e8e93; }
        .win-title {
            position: absolute; left: 0; right: 0; text-align: center;
            font-weight: 600; font-size: 13px; pointer-events: none;
        }
        .win:not(.focused) .win-title { opacity: .5; }
        .win-body { position: relative; flex: 1; min-height: 0; }
        .win-body iframe { width: 100%; height: 100%; border: 0; background: transparent; display: block; }
        .shield { position: absolute; inset: 0; display: none; }
        body.dragging .shield { display: block; }
        body.dragging iframe { pointer-events: none; }
        .grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 3; }

        /* ---- Dock ---- */
        .dock-wrap {
            position: fixed; left: 0; right: 0; bottom: 10px; z-index: 9400;
            display: flex; justify-content: center; pointer-events: none;
        }
        .dock {
            pointer-events: auto; display: flex; align-items: flex-end; gap: 8px;
            padding: 8px 10px 10px; border-radius: 22px;
            background: var(--dock); border: 1px solid var(--dockline);
            backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }
        .dock-sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--dockline); }
        .dock-item {
            position: relative; width: 52px; height: 52px; border-radius: 13px;
            display: grid; place-items: center; font-size: 28px; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 2px 6px rgba(0,0,0,.3);
            transform-origin: 50% 100%; transition: transform .12s ease-out;
        }
        .dock-item .tip {
            position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%);
            white-space: nowrap; padding: 4px 10px; border-radius: 7px; font-size: 12px; color: #fff;
            background: rgba(30,30,34,.85); opacity: 0; pointer-events: none; transition: opacity .12s;
        }
        .dock-item:hover .tip { opacity: 1; }
        .dock-item .dot {
            position: absolute; bottom: -7px; left: 50%; width: 4px; height: 4px; margin-left: -2px;
            border-radius: 50%; background: var(--menutext); opacity: 0;
        }
        .dock-item.open .dot { opacity: .85; }
        .dock-item.bounce { animation: bounce .5s ease-out 2; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }

        @media (max-width: 700px) {
            .dock-item { width: 40px; height: 40px; font-size: 22px; }
            .win { min-width: 0; }
        }
    </style>
</head>
<body>

<div class="menubar">
    <div class="left">
        <span class="logo">🛍️</span>
        <span class="appname" id="appname">Finder</span>
    </div>
    <div class="right">
        <span><span th:text="${#authentication.name}">admin</span></span>
        <small><form th:action="@{/auth/logout}" method="post" style="display:inline"><button type="submit" style="background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline">Đăng xuất</button></form></small>
        <span id="clock"></span>
    </div>
</div>

<div id="desktop"></div>

<div class="dock-wrap">
    <nav class="dock" id="dock">
        <a class="dock-item" data-app="overview" data-title="Tổng quan" th:attr="data-url=@{/admin/overview}" style="background:linear-gradient(#5ac8fa,#007aff)">📊<span class="tip">Tổng quan</span><i class="dot"></i></a>
        <a class="dock-item" data-app="products" data-title="Sản phẩm" th:attr="data-url=@{/admin/products}" style="background:linear-gradient(#ffcc66,#ff9500)">📦<span class="tip">Sản phẩm</span><i class="dot"></i></a>
        <a class="dock-item" data-app="categories" data-title="Danh mục" th:attr="data-url=@{/admin/categories}" style="background:linear-gradient(#d7a6f5,#af52de)">🗂️<span class="tip">Danh mục</span><i class="dot"></i></a>
                <a class="dock-item" data-app="vouchers" data-title="Voucher" th:attr="data-url=@{/admin/vouchers}" style="background:linear-gradient(#ffd479,#ff9500)">🎟️<span class="tip">Voucher</span><i class="dot"></i></a>
        <a class="dock-item" data-app="orders" data-title="Đơn hàng" th:attr="data-url=@{/admin/orders}" style="background:linear-gradient(#7ee69a,#30b650)">🧾<span class="tip">Đơn hàng</span><i class="dot"></i></a>
        <a class="dock-item" data-app="users" data-title="Người dùng" th:attr="data-url=@{/admin/users}" style="background:linear-gradient(#8fe3ff,#32ade6)">👥<span class="tip">Người dùng</span><i class="dot"></i></a>
        <a class="dock-item" data-app="reviews" data-title="Đánh giá" th:attr="data-url=@{/admin/reviews}" style="background:linear-gradient(#ffe066,#ffcc00)">⭐<span class="tip">Đánh giá</span><i class="dot"></i></a>
        <a class="dock-item" data-app="bestsellers" data-title="Bán chạy" th:attr="data-url=@{/admin/best-sellers}" style="background:linear-gradient(#ff7a9c,#ff2d55)">🔥<span class="tip">Bán chạy</span><i class="dot"></i></a>
        <a class="dock-item" data-app="inventory" data-title="Tồn kho" th:attr="data-url=@{/admin/inventory}" style="background:linear-gradient(#a5a4ff,#5856d6)">🏬<span class="tip">Tồn kho</span><i class="dot"></i></a>
        <span class="dock-sep"></span>
        <a class="dock-item" th:href="@{/products}" target="_blank" style="background:linear-gradient(#c7c7cc,#8e8e93)">🛍️<span class="tip">Cửa hàng</span><i class="dot"></i></a>
        <a class="dock-item" data-app="reset" data-title="Reset dữ liệu" th:attr="data-url=@{/admin/system/reset}" style="background:linear-gradient(#ff8a80,#ff3b30)">🗑️<span class="tip">Reset dữ liệu</span><i class="dot"></i></a>
    </nav>
</div>

<script>
(function () {
    var desktop = document.getElementById('desktop');
    var dock = document.getElementById('dock');
    var appname = document.getElementById('appname');
    var wins = {};          // id -> element
    var z = 10, cascade = 0;
    var MIN_W = 360, MIN_H = 240;

    /* ---------- Đồng hồ ---------- */
    function tick() {
        document.getElementById('clock').textContent = new Date().toLocaleString('vi-VN', {
            weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
        });
    }
    tick(); setInterval(tick, 20000);

    /* ---------- Dock ---------- */
    function dockItem(id) { return dock.querySelector('[data-app="' + id + '"]'); }
    function setOpen(id, open) { var d = dockItem(id); if (d) d.classList.toggle('open', open); }

    // Phóng to icon khi rê chuột như Dock thật
    var items = Array.prototype.slice.call(dock.querySelectorAll('.dock-item'));
    dock.addEventListener('mousemove', function (e) {
        items.forEach(function (it) {
            var r = it.getBoundingClientRect();
            var d = Math.abs(e.clientX - (r.left + r.width / 2));
            var s = Math.max(1, 1.55 - d / 110);
            it.style.transform = 'scale(' + s.toFixed(3) + ')';
        });
    });
    dock.addEventListener('mouseleave', function () {
        items.forEach(function (it) { it.style.transform = ''; });
    });

    dock.addEventListener('click', function (e) {
        var item = e.target.closest('.dock-item[data-app]');
        if (!item) return;
        e.preventDefault();
        openApp(item.dataset.app, item.dataset.title, item.dataset.url);
    });

    /* ---------- Cửa sổ ---------- */
    function focusWin(w) {
        Object.keys(wins).forEach(function (k) { wins[k].classList.remove('focused'); });
        w.classList.add('focused');
        w.style.zIndex = ++z;
        appname.textContent = w.dataset.title;
    }

    function openApp(id, title, url) {
        var w = wins[id];
        if (w) {                                  // đã mở: bật lại và đưa lên trên
            w.classList.remove('min');
            focusWin(w);
            return;
        }
        var item = dockItem(id);
        item.classList.add('bounce');
        setTimeout(function () { item.classList.remove('bounce'); }, 1000);

        var W = Math.min(900, window.innerWidth - 40);
        var H = Math.min(580, window.innerHeight - 28 - 120);
        var off = (cascade++ % 6) * 28;
        var left = Math.max(10, (window.innerWidth - W) / 2 - 60 + off);
        var top = Math.max(10, 24 + off);

        w = document.createElement('div');
        w.className = 'win';
        w.dataset.title = title;
        w.style.cssText = 'left:' + left + 'px;top:' + top + 'px;width:' + W + 'px;height:' + H + 'px';
        w.innerHTML =
            '<div class="win-bar"><div class="lights"><b data-act="close"></b><b data-act="min"></b><b data-act="max"></b></div>' +
            '<div class="win-title"></div></div>' +
            '<div class="win-body"><iframe></iframe><div class="shield"></div></div>' +
            '<div class="grip"></div>';
        w.querySelector('.win-title').textContent = title;
        w.querySelector('iframe').src = url;
        desktop.appendChild(w);
        wins[id] = w;
        setOpen(id, true);
        focusWin(w);

        // Nút đỏ / vàng / xanh
        w.querySelector('.lights').addEventListener('click', function (e) {
            var act = e.target.dataset.act;
            if (act === 'close') {
                w.classList.add('closing');
                setTimeout(function () { w.remove(); delete wins[id]; setOpen(id, false); }, 200);
                var rest = Object.keys(wins);
                appname.textContent = rest.length ? wins[rest[rest.length - 1]].dataset.title : 'Finder';
            } else if (act === 'min') {
                w.classList.add('min'); w.classList.remove('focused');
                appname.textContent = 'Finder';
            } else if (act === 'max') {
                w.classList.toggle('max');
            }
        });

        var bar = w.querySelector('.win-bar');
        bar.addEventListener('dblclick', function (e) {
            if (!e.target.closest('.lights')) w.classList.toggle('max');
        });

        // Kéo cửa sổ bằng thanh tiêu đề
        bar.addEventListener('pointerdown', function (e) {
            if (e.target.closest('.lights') || w.classList.contains('max')) return;
            focusWin(w);
            var sx = e.clientX, sy = e.clientY, ox = w.offsetLeft, oy = w.offsetTop;
            document.body.classList.add('dragging');
            bar.setPointerCapture(e.pointerId);
            function move(ev) {
                w.style.left = (ox + ev.clientX - sx) + 'px';
                w.style.top = Math.max(0, oy + ev.clientY - sy) + 'px';
            }
            function up() {
                document.body.classList.remove('dragging');
                bar.removeEventListener('pointermove', move);
                bar.removeEventListener('pointerup', up);
            }
            bar.addEventListener('pointermove', move);
            bar.addEventListener('pointerup', up);
        });

        // Đổi kích thước ở góc dưới bên phải
        var grip = w.querySelector('.grip');
        grip.addEventListener('pointerdown', function (e) {
            if (w.classList.contains('max')) return;
            focusWin(w);
            var sx = e.clientX, sy = e.clientY, ow = w.offsetWidth, oh = w.offsetHeight;
            document.body.classList.add('dragging');
            grip.setPointerCapture(e.pointerId);
            function move(ev) {
                w.style.width = Math.max(MIN_W, ow + ev.clientX - sx) + 'px';
                w.style.height = Math.max(MIN_H, oh + ev.clientY - sy) + 'px';
            }
            function up() {
                document.body.classList.remove('dragging');
                grip.removeEventListener('pointermove', move);
                grip.removeEventListener('pointerup', up);
            }
            grip.addEventListener('pointermove', move);
            grip.addEventListener('pointerup', up);
        });

        w.addEventListener('pointerdown', function () { if (!w.classList.contains('focused')) focusWin(w); });
    }

    // Bấm vào bên trong iframe không bắn sự kiện lên trang cha: dùng blur để biết cửa sổ nào được chọn
    window.addEventListener('blur', function () {
        setTimeout(function () {
            var a = document.activeElement;
            if (a && a.tagName === 'IFRAME') {
                var w = a.closest('.win');
                if (w && !w.classList.contains('focused')) focusWin(w);
            }
        }, 0);
    });

    // Mở sẵn ứng dụng Tổng quan khi vào màn hình chính
    var first = dockItem('overview');
    openApp('overview', first.dataset.title, first.dataset.url);
})();
</script>
</body>
</html>
