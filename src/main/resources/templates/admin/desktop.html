<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlareHub — Màn hình quản trị macOS</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            user-select: none;
        }

        /* Thanh menu bar macOS trên cùng */
        .menubar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 28px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
            z-index: 9999;
        }

        @media (prefers-color-scheme: dark) {
            .menubar {
                background: rgba(20, 24, 40, 0.8);
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                color: #f5f5f7;
            }
        }

        .menubar-left, .menubar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menubar-brand {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #FF6B1A;
        }

        .menubar a:hover {
            opacity: 0.8;
        }

        /* Desktop area */
        #desktop {
            position: absolute;
            top: 28px;
            bottom: 0;
            left: 0;
            right: 0;
            overflow: hidden;
        }

        /* Dock macOS */
        .dock-container {
            position: fixed;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 9998;
        }

        .dock {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        }

        @media (prefers-color-scheme: dark) {
            .dock {
                background: rgba(24, 28, 48, 0.55);
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
        }

        .dock-item {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            cursor: pointer;
            position: relative;
            transition: transform 120ms cubic-bezier(0.2, 0, 0, 1);
            transform-origin: bottom center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .dock-item .tip {
            position: absolute;
            bottom: 60px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 120ms;
        }

        .dock-item:hover .tip {
            opacity: 1;
        }

        .dock-item .dot {
            position: absolute;
            bottom: -5px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #fff;
            display: none;
        }

        .dock-item.open .dot {
            display: block;
        }

        .dock-sep {
            width: 1px;
            height: 36px;
            background: rgba(255, 255, 255, 0.3);
            margin: 0 4px;
        }

        /* Cửa sổ iframe macOS */
        .win {
            position: absolute;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 150ms;
        }

        @media (prefers-color-scheme: dark) {
            .win {
                box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            }
        }

        .win.min {
            display: none;
        }

        .win.max {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 76px) !important;
            border-radius: 0;
        }

        .win-bar {
            height: 38px;
            background: var(--window-header);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            padding: 0 14px;
            position: relative;
            cursor: default;
        }

        .win-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .win-body {
            flex: 1;
            position: relative;
            background: var(--card);
        }

        .win-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .shield {
            position: absolute;
            inset: 0;
            display: none;
        }

        body.dragging .shield {
            display: block;
        }

        .grip {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
        }
    </style>
</head>
<body>

<!-- Menubar trên cùng -->
<header class="menubar">
    <div class="menubar-left">
        <span class="menubar-brand">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C8.5 7 6 9.5 6 13a6 6 0 0 0 12 0c0-3.5-2.5-6-6-11zm0 16a4 4 0 0 1-4-4c0-1.8 1.2-3.6 2.8-5.3.3.8.8 1.6 1.4 2.2.4.4.8.7 1.3 1 0 0 .5.3.5.8a2 2 0 0 1-2 2z"/>
            </svg>
            FlareHub
        </span>
        <b id="appname" style="font-size: 13px;">Finder</b>
        <a th:href="@{/products}" target="_blank">Cửa hàng</a>
    </div>
    <div class="menubar-right">
        <span id="clock">Th 2, 24 thg 10 12:00</span>
        <span>Admin: <strong th:text="${#authentication.name}">admin</strong></span>
        <form th:action="@{/auth/logout}" method="post" style="display:inline">
            <button type="submit" style="background:none; border:none; color: #ff5f57; font-size:12px; font-weight:600; cursor:pointer;">
                Đăng xuất
            </button>
        </form>
    </div>
</header>

<!-- Vùng Desktop chứa các cửa sổ iframe -->
<div id="desktop"></div>

<!-- Dock macOS -->
<div class="dock-container">
    <nav id="dock" class="dock">
        <a class="dock-item" data-app="overview" data-title="Tổng quan" th:attr="data-url=@{/admin/overview}" style="background:linear-gradient(#FF8C42,#FF6B1A)">
            📊<span class="tip">Tổng quan</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="products" data-title="Sản phẩm" th:attr="data-url=@{/admin/products}" style="background:linear-gradient(#ffb340,#ff9500)">
            📱<span class="tip">Sản phẩm</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="categories" data-title="Danh mục" th:attr="data-url=@{/admin/categories}" style="background:linear-gradient(#c77dff,#af52de)">
            ☰<span class="tip">Danh mục</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="orders" data-title="Đơn hàng" th:attr="data-url=@{/admin/orders}" style="background:linear-gradient(#62e085,#34c759)">
            ✓<span class="tip">Đơn hàng</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="users" data-title="Người dùng" th:attr="data-url=@{/admin/users}" style="background:linear-gradient(#8fe3ff,#32ade6)">
            👥<span class="tip">Người dùng</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="reviews" data-title="Đánh giá" th:attr="data-url=@{/admin/reviews}" style="background:linear-gradient(#ffe066,#ffcc00)">
            ⭐<span class="tip">Đánh giá</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="bestsellers" data-title="Bán chạy" th:attr="data-url=@{/admin/best-sellers}" style="background:linear-gradient(#ff7a9c,#ff2d55)">
            🔥<span class="tip">Bán chạy</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="inventory" data-title="Tồn kho" th:attr="data-url=@{/admin/inventory}" style="background:linear-gradient(#a5a4ff,#5856d6)">
            🏬<span class="tip">Tồn kho</span><i class="dot"></i>
        </a>
        <span class="dock-sep"></span>
        <a class="dock-item" th:href="@{/products}" target="_blank" style="background:linear-gradient(#c7c7cc,#8e8e93)">
            🛍️<span class="tip">Xem Cửa hàng</span><i class="dot"></i>
        </a>
        <a class="dock-item" data-app="reset" data-title="Reset dữ liệu" th:attr="data-url=@{/admin/system/reset}" style="background:linear-gradient(#ff8a80,#ff3b30)">
            🗑️<span class="tip">Reset dữ liệu</span><i class="dot"></i>
        </a>
    </nav>
</div>

<!-- Script quản lý cửa sổ iframe & tương tác Dock -->
<script>
(function () {
    var desktop = document.getElementById('desktop');
    var dock = document.getElementById('dock');
    var appname = document.getElementById('appname');
    var wins = {};
    var z = 10, cascade = 0;
    var MIN_W = 360, MIN_H = 240;

    function tick() {
        document.getElementById('clock').textContent = new Date().toLocaleString('vi-VN', {
            weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
        });
    }
    tick();
    setInterval(tick, 20000);

    function dockItem(id) { return dock.querySelector('[data-app="' + id + '"]'); }
    function setOpen(id, open) { var d = dockItem(id); if (d) d.classList.toggle('open', open); }

    var items = Array.prototype.slice.call(dock.querySelectorAll('.dock-item'));
    dock.addEventListener('mousemove', function (e) {
        items.forEach(function (it) {
            var r = it.getBoundingClientRect();
            var d = Math.abs(e.clientX - (r.left + r.width / 2));
            var s = Math.max(1, 1.45 - d / 110);
            it.style.transform = 'scale(' + s.toFixed(3) + ')';
        });
    });
    dock.addEventListener('mouseleave', function () {
        items.forEach(function (it) { it.style.transform = ''; });
    });

    dock.addEventListener('click', function (e) {
        var item = e.target.closest('.dock-item[data-app]');
        if (!item) return;
        e.preventDefault();
        openApp(item.dataset.app, item.dataset.title, item.dataset.url);
    });

    function focusWin(w) {
        Object.keys(wins).forEach(function (k) { wins[k].classList.remove('focused'); });
        w.classList.add('focused');
        w.style.zIndex = ++z;
        appname.textContent = w.dataset.title;
    }

    function openApp(id, title, url) {
        var w = wins[id];
        if (w) {
            w.classList.remove('min');
            focusWin(w);
            return;
        }

        var item = dockItem(id);
        if (item) {
            item.classList.add('bounce');
            setTimeout(function () { item.classList.remove('bounce'); }, 1000);
        }

        var W = Math.min(940, window.innerWidth - 40);
        var H = Math.min(600, window.innerHeight - 28 - 120);
        var off = (cascade++ % 6) * 26;
        var left = Math.max(10, (window.innerWidth - W) / 2 - 40 + off);
        var top = Math.max(10, 20 + off);

        w = document.createElement('div');
        w.className = 'win';
        w.dataset.title = title;
        w.style.cssText = 'left:' + left + 'px;top:' + top + 'px;width:' + W + 'px;height:' + H + 'px';
        w.innerHTML =
            '<div class="win-bar"><div class="lights"><b data-act="close"></b><b data-act="min"></b><b data-act="max"></b></div>' +
            '<div class="win-title"></div></div>' +
            '<div class="win-body"><iframe loading="lazy"></iframe><div class="shield"></div></div>' +
            '<div class="grip"></div>';

        w.querySelector('.win-title').textContent = title;
        w.querySelector('iframe').src = url;
        desktop.appendChild(w);
        wins[id] = w;
        setOpen(id, true);
        focusWin(w);

        w.querySelector('.lights').addEventListener('click', function (e) {
            var act = e.target.dataset.act;
            if (act === 'close') {
                w.remove();
                delete wins[id];
                setOpen(id, false);
                var rest = Object.keys(wins);
                appname.textContent = rest.length ? wins[rest[rest.length - 1]].dataset.title : 'Finder';
            } else if (act === 'min') {
                w.classList.add('min');
                w.classList.remove('focused');
                appname.textContent = 'Finder';
            } else if (act === 'max') {
                w.classList.toggle('max');
            }
        });

        var bar = w.querySelector('.win-bar');
        bar.addEventListener('dblclick', function (e) {
            if (!e.target.closest('.lights')) w.classList.toggle('max');
        });

        bar.addEventListener('pointerdown', function (e) {
            if (e.target.closest('.lights') || w.classList.contains('max')) return;
            focusWin(w);
            var sx = e.clientX, sy = e.clientY, ox = w.offsetLeft, oy = w.offsetTop;
            document.body.classList.add('dragging');
            bar.setPointerCapture(e.pointerId);

            function move(ev) {
                w.style.left = (ox + ev.clientX - sx) + 'px';
                w.style.top = Math.max(0, oy + ev.clientY - sy) + 'px';
            }
            function up() {
                document.body.classList.remove('dragging');
                bar.removeEventListener('pointermove', move);
                bar.removeEventListener('pointerup', up);
            }
            bar.addEventListener('pointermove', move);
            bar.addEventListener('pointerup', up);
        });

        var grip = w.querySelector('.grip');
        grip.addEventListener('pointerdown', function (e) {
            if (w.classList.contains('max')) return;
            focusWin(w);
            var sx = e.clientX, sy = e.clientY, ow = w.offsetWidth, oh = w.offsetHeight;
            document.body.classList.add('dragging');
            grip.setPointerCapture(e.pointerId);

            function move(ev) {
                w.style.width = Math.max(MIN_W, ow + ev.clientX - sx) + 'px';
                w.style.height = Math.max(MIN_H, oh + ev.clientY - sy) + 'px';
            }
            function up() {
                document.body.classList.remove('dragging');
                grip.removeEventListener('pointermove', move);
                grip.removeEventListener('pointerup', up);
            }
            grip.addEventListener('pointermove', move);
            grip.addEventListener('pointerup', up);
        });

        w.addEventListener('pointerdown', function () {
            if (!w.classList.contains('focused')) focusWin(w);
        });
    }

    var first = dockItem('overview');
    if (first) {
        openApp('overview', first.dataset.title, first.dataset.url);
    }
})();
</script>
</body>
</html>
