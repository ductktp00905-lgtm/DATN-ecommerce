<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đánh giá — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('reviews')}"></aside>
        
        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Quản lý đánh giá sản phẩm</h1>
                    <div class="sub">Duyệt và kiểm soát các nhận xét từ khách hàng trên toàn hệ thống</div>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <!-- BỘ LỌC ĐÁNH GIÁ THEO SỐ SAO -->
            <section class="panel" style="padding: 14px 18px; margin-bottom: 20px;">
                <form method="get" th:action="@{/admin/reviews}" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <label for="maxRating" style="margin: 0; font-size: 13px; font-weight: 600;">Lọc đánh giá tối đa:</label>
                    <select id="maxRating" name="maxRating" style="width: 180px; padding: 6px 10px;">
                        <option value="">-- Mọi mức sao (1-5) --</option>
                        <option value="1" th:selected="${maxRating == 1}">Chỉ 1 sao (tiêu cực)</option>
                        <option value="2" th:selected="${maxRating == 2}">Từ 2 sao trở xuống</option>
                        <option value="3" th:selected="${maxRating == 3}">Từ 3 sao trở xuống</option>
                        <option value="4" th:selected="${maxRating == 4}">Từ 4 sao trở xuống</option>
                    </select>
                    <button type="submit" class="btn">Lọc</button>
                    <a th:href="@{/admin/reviews}" class="btn btn-plain">Tất cả</a>
                </form>
            </section>

            <!-- BẢNG DANH SÁCH ĐÁNH GIÁ -->
            <section class="panel">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 60px;">ID</th>
                                <th>Thời gian</th>
                                <th>Khách hàng</th>
                                <th>Sản phẩm</th>
                                <th>Số sao</th>
                                <th>Nội dung nhận xét</th>
                                <th style="text-align: center; width: 100px;">Gỡ bỏ</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${reviews}">
                                <td th:text="'#' + ${r.reviewID}">#1</td>
                                <td th:text="${#temporals.format(r.createdDate, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                                <td><strong th:text="${r.user.username}">user</strong></td>
                                <td>
                                    <a class="link" th:href="@{/products/{id}(id=${r.product.productID})}" target="_blank"
                                       th:text="${r.product.name}">Tên sản phẩm</a>
                                </td>
                                <td>
                                    <span style="color: #F59E0B; font-weight: 700;" th:text="${r.rating} + ' ★'">5 ★</span>
                                </td>
                                <td style="max-width: 320px; font-size: 13px;" th:text="${r.comment != null and !r.comment.isEmpty()} ? ${r.comment} : '(Không có nhận xét văn bản)'">
                                    Nội dung
                                </td>
                                <td style="text-align: center;">
                                    <form th:action="@{/admin/reviews/delete/{id}(id=${r.reviewID})}" method="post"
                                          onsubmit="return confirm('Bạn chắc chắn muốn gỡ bỏ đánh giá này khỏi sản phẩm?');"
                                          style="display: inline;">
                                        <input type="hidden" name="maxRating" th:value="${maxRating}">
                                        <button type="submit" class="btn-danger">Gỡ bỏ</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(reviews)}">
                                <td colspan="7" class="empty">Không tìm thấy đánh giá nào</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
