<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử hoạt động — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('users')}"></aside>
        
        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Lịch sử hoạt động</h1>
                    <div class="sub">
                        Tài khoản: <strong th:text="${target.username}">username</strong> (<span th:text="${target.email}">email</span>)
                    </div>
                </div>
                <a class="btn btn-plain" th:href="@{/admin/users}">← Quay lại Quản lý người dùng</a>
            </div>

            <section class="panel">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Hành động</th>
                                <th>Chi tiết sự kiện</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${events}">
                                <td th:text="${#temporals.format(e.time, 'dd/MM/yyyy HH:mm:ss')}">01/01/2026</td>
                                <td><strong th:text="${e.group}">ACTION</strong></td>
                                <td th:text="${e.text}">Chi tiết hoạt động</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(events)}">
                                <td colspan="3" class="empty">Chưa ghi nhận sự kiện hoạt động nào cho tài khoản này</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
