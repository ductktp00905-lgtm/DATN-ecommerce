<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý danh mục — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('categories')}"></aside>
        
        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Danh mục sản phẩm</h1>
                    <div class="sub">Phân nhóm các mặt hàng công nghệ tại FlareHub</div>
                </div>
                <a class="btn" th:href="@{/admin/categories/new}">+ Thêm danh mục mới</a>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <section class="panel">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Tên danh mục</th>
                                <th style="text-align: center; width: 160px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${categories}">
                                <td th:text="'#' + ${c.categoryID}">#1</td>
                                <td>
                                    <strong style="color: var(--text-heading);" th:text="${c.categoryName}">Điện thoại</strong>
                                </td>
                                <td style="text-align: center;">
                                    <div class="actions" style="justify-content: center;">
                                        <a class="link" th:href="@{/admin/categories/edit/{id}(id=${c.categoryID})}">✏️ Sửa</a>
                                        <form th:action="@{/admin/categories/delete/{id}(id=${c.categoryID})}" method="post"
                                              onsubmit="return confirm('Bạn chắc chắn muốn xóa danh mục này?');"
                                              style="display: inline;">
                                            <button type="submit" class="btn-danger">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categories)}">
                                <td colspan="3" class="empty">Chưa có danh mục nào trong hệ thống</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
