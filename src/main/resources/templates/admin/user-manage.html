<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <h2>Quản lý người dùng</h2>

        <table>
            <tr>
                <th>ID</th><th>Username</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Hành động</th>
            </tr>
            <tr th:each="u : ${users}">
                <td th:text="${u.userID}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.role}"></td>
                <td th:text="${u.isActive} ? 'Hoạt động' : 'Đã khóa'"></td>
                <td>
                    <form th:action="@{/admin/users/toggle-active/{id}(id=${u.userID})}" method="post" style="display:inline">
                        <button type="submit" th:text="${u.isActive} ? 'Khóa' : 'Mở khóa'"></button>
                    </form>
                    <form th:action="@{/admin/users/change-role/{id}(id=${u.userID})}" method="post" style="display:inline">
                        <select name="role">
                            <option value="CUSTOMER" th:selected="${u.role == 'CUSTOMER'}">CUSTOMER</option>
                            <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
                        </select>
                        <button type="submit">Đổi quyền</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
