<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('products')}"></aside>

        <main class="content">
            <h1 th:text="${product.productID != null} ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'"></h1>
            <div class="sub">Nhập thông tin sản phẩm</div>

            <form class="form"
                  th:action="${product.productID != null}
                      ? @{/admin/products/edit/{id}(id=${product.productID})}
                      : @{/admin/products/new}"
                  method="post">

                <label>Tên sản phẩm</label>
                <input type="text" name="name" th:value="${product.name}" required>

                <label>Mô tả</label>
                <textarea name="description" rows="3" th:text="${product.description}"></textarea>

                <label>Giá</label>
                <input type="number" step="0.01" name="price" th:value="${product.price}" required>

                <label>Tồn kho</label>
                <input type="number" name="stock" th:value="${product.stock}" required>

                <label>Danh mục</label>
                <select name="categoryId" required>
                    <option th:each="c : ${categories}"
                            th:value="${c.categoryID}"
                            th:text="${c.categoryName}"
                            th:selected="${product.category != null and product.category.categoryID == c.categoryID}">
                    </option>
                </select>

                <label>URL hình ảnh</label>
                <input type="text" name="imageURL" th:value="${product.imageURL}">

                <div class="buttons">
                    <button type="submit">Lưu</button>
                    <a class="btn btn-plain" th:href="@{/admin/products}">Hủy</a>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
