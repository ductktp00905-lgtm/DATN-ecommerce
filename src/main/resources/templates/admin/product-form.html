<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <h2 th:text="${product.productID != null} ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'"></h2>

        <form th:action="${product.productID != null}
                  ? @{/admin/products/edit/{id}(id=${product.productID})}
                  : @{/admin/products/new}"
              method="post">

            <label>Tên sản phẩm:</label><br>
            <input type="text" name="name" th:value="${product.name}" required><br>

            <label>Mô tả:</label><br>
            <textarea name="description" rows="3" cols="40" th:text="${product.description}"></textarea><br>

            <label>Giá:</label><br>
            <input type="number" step="0.01" name="price" th:value="${product.price}" required><br>

            <label>Tồn kho:</label><br>
            <input type="number" name="stock" th:value="${product.stock}" required><br>

            <label>Danh mục:</label><br>
            <select name="categoryId" required>
                <option th:each="c : ${categories}"
                        th:value="${c.categoryID}"
                        th:text="${c.categoryName}"
                        th:selected="${product.category != null and product.category.categoryID == c.categoryID}">
                </option>
            </select><br>

            <label>URL hình ảnh:</label><br>
            <input type="text" name="imageURL" th:value="${product.imageURL}"><br><br>

            <button type="submit">Lưu</button>
            <a th:href="@{/admin/products}">Hủy</a>
        </form>
    </div>
</body>
</html>
