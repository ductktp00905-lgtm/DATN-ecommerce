<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin sản phẩm — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('products')}"></aside>
        
        <main class="content">
            <h1 th:text="${product.productID != null} ? 'Sửa thông tin sản phẩm' : 'Thêm sản phẩm mới'"></h1>
            <div class="sub">Nhập thông tin chi tiết thiết bị công nghệ</div>

            <!-- Khối hiển thị thông báo lỗi J1/U7 -->
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <form class="form"
                  th:action="${product.productID != null}
                      ? @{/admin/products/edit/{id}(id=${product.productID})}
                      : @{/admin/products/new}"
                  method="post">
                
                <label for="p-name">Tên sản phẩm *</label>
                <input type="text" id="p-name" name="name" th:value="${product.name}" required placeholder="VD: iPhone 16 Pro Max 256GB">

                <label for="p-desc">Mô tả sản phẩm</label>
                <textarea id="p-desc" name="description" rows="4" th:text="${product.description}" placeholder="Mô tả cấu hình, tính năng, phụ kiện đi kèm..."></textarea>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div>
                        <label for="p-price">Giá bán (₫) *</label>
                        <input type="number" id="p-price" step="0.01" name="price" th:value="${product.price}" required placeholder="VD: 34990000">
                    </div>
                    <div>
                        <label for="p-stock">Số lượng tồn kho *</label>
                        <input type="number" id="p-stock" name="stock" th:value="${product.stock}" required placeholder="VD: 50">
                    </div>
                </div>

                <label for="p-category">Danh mục sản phẩm *</label>
                <select id="p-category" name="categoryId" required>
                    <option th:each="c : ${categories}"
                            th:value="${c.categoryID}"
                            th:text="${c.categoryName}"
                            th:selected="${product.category != null and product.category.categoryID == c.categoryID}">
                    </option>
                </select>

                <label for="p-image">URL hình ảnh sản phẩm</label>
                <input type="text" id="p-image" name="imageURL" th:value="${product.imageURL}" placeholder="https://example.com/images/iphone-16.jpg">

                <div class="buttons">
                    <button type="submit" class="btn">Lưu sản phẩm</button>
                    <a class="btn btn-plain" th:href="@{/admin/products}">Hủy</a>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
