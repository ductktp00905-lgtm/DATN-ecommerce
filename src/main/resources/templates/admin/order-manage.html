<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đơn hàng</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('orders')}"></aside>

        <main class="content">
            <h1>Đơn hàng</h1>
            <div class="sub">Theo dõi và cập nhật trạng thái đơn hàng</div>

            <section class="panel">
                <table>
                    <thead>
                        <tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th>Cập nhật</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="o : ${orders}">
                            <td th:text="'#' + ${o.orderID}"></td>
                            <td th:text="${o.user.username}"></td>
                            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="nowrap" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${o.status == 'PENDING'} ? 'badge-pending' : (${o.status == 'SHIPPING'} ? 'badge-shipping' : (${o.status == 'COMPLETED'} ? 'badge-completed' : 'badge-cancelled'))"
                                      th:text="${o.status}"></span>
                            </td>
                            <td>
                                <form class="actions" th:action="@{/admin/orders/update-status/{id}(id=${o.orderID})}" method="post">
                                    <select name="status">
                                        <option value="PENDING" th:selected="${o.status == 'PENDING'}">PENDING</option>
                                        <option value="SHIPPING" th:selected="${o.status == 'SHIPPING'}">SHIPPING</option>
                                        <option value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">COMPLETED</option>
                                        <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">CANCELLED</option>
                                    </select>
                                    <button type="submit">Cập nhật</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="6" class="empty">Chưa có đơn hàng nào</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
</body>
</html>
