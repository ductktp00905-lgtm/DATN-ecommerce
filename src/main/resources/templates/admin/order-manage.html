<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đơn hàng — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('orders')}"></aside>
        
        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Quản lý đơn hàng</h1>
                    <div class="sub">Theo dõi và cập nhật trạng thái đơn hàng của khách</div>
                </div>
            </div>

            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <section class="panel">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 70px;">Mã đơn</th>
                                <th>Thời gian đặt</th>
                                <th>Khách hàng</th>
                                <th>Địa chỉ giao hàng</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái hiện tại</th>
                                <th>Cập nhật trạng thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="o : ${orders}">
                                <td><strong th:text="'#' + ${o.orderID}">#1001</strong></td>
                                <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}">01/01/2026 12:00</td>
                                <td th:text="${o.user != null ? o.user.username : 'Khách vãng lai'}">username</td>
                                <td style="max-width: 200px; font-size: 12px; color: var(--muted);" th:text="${o.shippingAddress}">Địa chỉ</td>
                                <td class="nowrap" style="font-weight: 700; color: var(--accent);">
                                    <span th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'POINT', 0, 'COMMA')}"></span> ₫
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${o.status == 'PENDING'} ? 'badge-pending' : (${o.status == 'SHIPPING'} ? 'badge-shipping' : (${o.status == 'COMPLETED'} ? 'badge-completed' : 'badge-cancelled'))">
                                        <th:block th:switch="${o.status}">
                                            <span th:case="'PENDING'">⏳ Chờ xử lý</span>
                                            <span th:case="'SHIPPING'">🚚 Đang giao</span>
                                            <span th:case="'COMPLETED'">✅ Hoàn thành</span>
                                            <span th:case="'CANCELLED'">❌ Đã hủy</span>
                                            <span th:case="*" th:text="${o.status}"></span>
                                        </th:block>
                                    </span>
                                </td>
                                <td>
                                    <form class="actions" th:action="@{/admin/orders/update-status/{id}(id=${o.orderID})}" method="post">
                                        <select name="status" style="padding: 4px 8px; font-size: 12px; border-radius: 6px;">
                                            <option value="PENDING" th:selected="${o.status == 'PENDING'}">Chờ xử lý</option>
                                            <option value="SHIPPING" th:selected="${o.status == 'SHIPPING'}">Đang giao</option>
                                            <option value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">Hoàn thành</option>
                                            <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">Đã hủy</option>
                                        </select>
                                        <button type="submit" class="btn btn-plain" style="padding: 4px 10px; font-size: 12px;">Đổi</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(orders)}">
                                <td colspan="7" class="empty">Chưa có đơn hàng nào trong hệ thống</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
