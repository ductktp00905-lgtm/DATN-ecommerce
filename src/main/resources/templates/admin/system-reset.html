<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset dữ liệu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <h2>Reset dữ liệu hệ thống</h2>

        <p th:if="${param.success}" class="alert-success">Đã xóa toàn bộ dữ liệu thành công!</p>

        <p style="color:#991b1b; font-weight:600; margin-bottom:16px">
            ⚠️ Cảnh báo: thao tác này sẽ xóa TOÀN BỘ dữ liệu (người dùng, sản phẩm, đơn hàng, thanh toán) và không thể hoàn tác.
            Chỉ dùng khi test, không dùng khi có dữ liệu thật.
        </p>

        <form th:action="@{/admin/system/reset-all}" method="post"
              onsubmit="return confirm('Bạn CHẮC CHẮN muốn xóa toàn bộ dữ liệu? Hành động này không thể hoàn tác!');">
            <button type="submit" style="background-color:#7f1d1d">Xóa toàn bộ dữ liệu</button>
        </form>
    </div>
</body>
</html>
