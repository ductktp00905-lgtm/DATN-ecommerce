<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('overview')}"></aside>

        <main class="content">
            <h1>Tổng quan</h1>
            <div class="sub">Số liệu hoạt động của cửa hàng</div>

            <div class="stats">
                <div class="stat">
                    <div class="top"><span class="name">Tổng doanh thu</span><span class="ico" style="background:#34c759">₫</span></div>
                    <div class="num"><span th:text="${#numbers.formatDecimal(totalRevenue, 0, 'POINT', 0, 'COMMA')}">0</span> <small>đ</small></div>
                </div>
                <div class="stat">
                    <div class="top"><span class="name">Tổng đơn hàng</span><span class="ico" style="background:#007aff">✓</span></div>
                    <div class="num" th:text="${totalOrders}">0</div>
                </div>
                <div class="stat">
                    <div class="top"><span class="name">Tổng sản phẩm</span><span class="ico" style="background:#ff9500">▣</span></div>
                    <div class="num" th:text="${totalProducts}">0</div>
                </div>
                <div class="stat">
                    <div class="top"><span class="name">Tổng người dùng</span><span class="ico" style="background:#5ac8fa">☺</span></div>
                    <div class="num" th:text="${totalUsers}">0</div>
                </div>
            </div>

            <section class="panel">
                <h2>Đơn hàng gần đây</h2>
                <table>
                    <thead>
                        <tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="o : ${recentOrders}">
                            <td th:text="'#' + ${o.orderID}"></td>
                            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="nowrap" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${o.status == 'PENDING'} ? 'badge-pending' : (${o.status == 'SHIPPING'} ? 'badge-shipping' : (${o.status == 'COMPLETED'} ? 'badge-completed' : 'badge-cancelled'))"
                                      th:text="${o.status}"></span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recentOrders)}">
                            <td colspan="4" class="empty">Chưa có đơn hàng nào</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
</body>
</html>
