<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <h2>Dashboard Admin</h2>

        <div class="stat-cards">
            <div class="stat-card">
                <strong>Tổng doanh thu</strong>
                <span th:text="${totalRevenue}"></span> đ
            </div>
            <div class="stat-card">
                <strong>Tổng đơn hàng</strong>
                <span th:text="${totalOrders}"></span>
            </div>
            <div class="stat-card">
                <strong>Tổng sản phẩm</strong>
                <span th:text="${totalProducts}"></span>
            </div>
            <div class="stat-card">
                <strong>Tổng người dùng</strong>
                <span th:text="${totalUsers}"></span>
            </div>
        </div>

        <h3>Đơn hàng gần đây</h3>
        <table>
            <tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr>
            <tr th:each="o : ${recentOrders}">
                <td th:text="${o.orderID}"></td>
                <td th:text="${o.orderDate}"></td>
                <td th:text="${o.totalAmount}"></td>
                <td th:text="${o.status}"></td>
            </tr>
        </table>

        <br>
        <a th:href="@{/admin/products}">Quản lý sản phẩm</a> |
        <a th:href="@{/admin/orders}">Quản lý đơn hàng</a> |
        <a th:href="@{/admin/users}">Quản lý người dùng</a> |
        <a th:href="@{/admin/system/reset}" style="color:#7f1d1d; font-weight:700">⚠️ Reset dữ liệu (test)</a>
    </div>
</body>
</html>
