<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('products')}"></aside>
        
        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Quản lý sản phẩm</h1>
                    <div class="sub">Danh sách thiết bị công nghệ và tình trạng kho hàng</div>
                </div>
                <a class="btn" th:href="@{/admin/products/new}">+ Thêm sản phẩm mới</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <section class="panel">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 60px;">ID</th>
                                <th>Tên sản phẩm</th>
                                <th>Danh mục</th>
                                <th>Đơn giá</th>
                                <th>Tồn kho</th>
                                <th style="text-align: center;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${products}">
                                <td th:text="'#' + ${p.productID}">#1</td>
                                <td>
                                    <strong style="color: var(--text-heading);" th:text="${p.name}">Tên SP</strong>
                                </td>
                                <td>
                                    <span class="badge" style="background: var(--hover);" th:text="${p.category != null ? p.category.categoryName : 'Chưa phân loại'}"></span>
                                </td>
                                <td class="nowrap" style="font-weight: 700; color: var(--accent);"
                                    th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                                </td>
                                <td>
                                    <span th:if="${p.stock > 5}" style="font-weight: 600;" th:text="${p.stock}">10</span>
                                    <span th:if="${p.stock > 0 and p.stock <= 5}" class="badge badge-pending" th:text="${p.stock} + ' (Sắp hết)'">3</span>
                                    <span th:if="${p.stock <= 0}" class="badge badge-cancelled">Hết hàng</span>
                                </td>
                                <td style="text-align: center;">
                                    <div class="actions" style="justify-content: center;">
                                        <a class="link" th:href="@{/admin/products/edit/{id}(id=${p.productID})}">✏️ Sửa</a>
                                        <form th:action="@{/admin/products/delete/{id}(id=${p.productID})}" method="post"
                                              onsubmit="return confirm('Bạn chắc chắn muốn xóa sản phẩm này?');"
                                              style="display: inline;">
                                            <button type="submit" class="btn-danger">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="6" class="empty">Chưa có sản phẩm nào trong hệ thống</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
