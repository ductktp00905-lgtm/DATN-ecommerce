<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/admin-macos.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('products')}"></aside>

        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Sản phẩm</h1>
                    <div class="sub">Quản lý danh sách sản phẩm</div>
                </div>
                <a class="btn" th:href="@{/admin/products/new}">+ Thêm sản phẩm</a>
            </div>

            <section class="panel">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Hành động</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td th:text="${p.productID}"></td>
                            <td th:text="${p.name}"></td>
                            <td th:text="${p.category.categoryName}"></td>
                            <td class="nowrap" th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                            <td th:text="${p.stock}"></td>
                            <td>
                                <div class="actions">
                                    <a class="link" th:href="@{/admin/products/edit/{id}(id=${p.productID})}">Sửa</a>
                                    <form th:action="@{/admin/products/delete/{id}(id=${p.productID})}" method="post"
                                          onsubmit="return confirm('Xác nhận xóa sản phẩm này?');">
                                        <button type="submit" class="btn-danger">Xóa</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6" class="empty">Chưa có sản phẩm nào</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</div>
</body>
</html>
