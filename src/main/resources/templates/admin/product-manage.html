<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <h2>Quản lý sản phẩm</h2>
        <a th:href="@{/admin/products/new}"><button>+ Thêm sản phẩm mới</button></a>

        <br><br>
        <table>
            <tr>
                <th>ID</th><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Hành động</th>
            </tr>
            <tr th:each="p : ${products}">
                <td th:text="${p.productID}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.category.categoryName}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.stock}"></td>
                <td>
                    <a th:href="@{/admin/products/edit/{id}(id=${p.productID})}">Sửa</a>
                    &nbsp;|&nbsp;
                    <form th:action="@{/admin/products/delete/{id}(id=${p.productID})}" method="post" style="display:inline"
                          onsubmit="return confirm('Xác nhận xóa sản phẩm này?');">
                        <button type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
