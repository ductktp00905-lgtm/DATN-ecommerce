<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm — FlareHub Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="window">
    <div th:replace="~{layout/admin-shell :: titlebar}"></div>
    <div class="body">
        <aside th:replace="~{layout/admin-shell :: sidebar('products')}"></aside>
        
        <main class="content">
            <div class="toolbar">
                <div>
                    <h1>Quản lý sản phẩm</h1>
                    <div class="sub">Danh sách thiết bị điện máy, gia dụng thông minh và tình trạng kho hàng</div>
                </div>
                <a class="btn" th:href="@{/admin/products/new}">+ Thêm sản phẩm mới</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" style="background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;" th:text="${successMessage}"></div>

            <section class="panel">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px;">ID</th>
                                <th style="width: 70px;">Ảnh</th>
                                <th>Tên sản phẩm & Biến thể</th>
                                <th>Danh mục</th>
                                <th>Khoảng giá</th>
                                <th>Tồn kho</th>
                                <th style="text-align: center; width: 140px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${products}">
                                <td th:text="'#' + ${p.productID}">#1</td>
                                <td>
                                    <img th:if="${p.imageURL != null and p.imageURL != ''}"
                                         th:src="${p.imageURL}"
                                         alt="Product thumbnail"
                                         style="width: 48px; height: 48px; object-fit: contain; border-radius: 4px; border: 1px solid #e2e8f0; background: #f8fafc; padding: 2px;">
                                    <div th:unless="${p.imageURL != null and p.imageURL != ''}"
                                         style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 4px; font-size: 1.2rem;">
                                        📺
                                    </div>
                                </td>
                                <td>
                                    <div style="font-weight: 700; color: var(--text-heading);" th:text="${p.name}">Tên SP</div>
                                    <div th:if="${p.variants != null and !p.variants.isEmpty()}" style="margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap;">
                                        <span class="badge" style="background: #e0f2fe; color: #0369a1; font-size: 10px;"
                                              th:text="${#lists.size(p.variants)} + ' biến thể'"></span>
                                        <span th:each="v : ${p.variants}"
                                              class="badge" style="background: #f1f5f9; color: #475569; font-size: 10px;"
                                              th:text="${v.variantName}"></span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge" style="background: var(--hover);" th:text="${p.category != null ? p.category.categoryName : 'Chưa phân loại'}"></span>
                                </td>
                                <td class="nowrap" style="font-weight: 700; color: var(--accent);">
                                    <span th:if="${p.minPrice != null and p.maxPrice != null and p.minPrice.compareTo(p.maxPrice) != 0}"
                                          th:text="${#numbers.formatDecimal(p.minPrice, 0, 'POINT', 0, 'COMMA')} + ' - ' + ${#numbers.formatDecimal(p.maxPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                                    </span>
                                    <span th:unless="${p.minPrice != null and p.maxPrice != null and p.minPrice.compareTo(p.maxPrice) != 0}"
                                          th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'">
                                    </span>
                                </td>
                                <td>
                                    <span th:with="totalStock=${p.totalVariantStock}">
                                        <span th:if="${totalStock > 5}" style="font-weight: 600;" th:text="${totalStock} + ' máy'">10 máy</span>
                                        <span th:if="${totalStock > 0 and totalStock <= 5}" class="badge badge-pending" th:text="${totalStock} + ' (Sắp hết)'">3</span>
                                        <span th:if="${totalStock <= 0}" class="badge badge-cancelled">Hết hàng</span>
                                    </span>
                                </td>
                                <td style="text-align: center;">
                                    <div class="actions" style="justify-content: center;">
                                        <a class="link" th:href="@{/admin/products/edit/{id}(id=${p.productID})}">✏️ Sửa</a>
                                        <form th:action="@{/admin/products/delete/{id}(id=${p.productID})}" method="post"
                                              onsubmit="return confirm('Bạn chắc chắn muốn xóa sản phẩm này?');"
                                              style="display: inline;">
                                            <button type="submit" class="btn-danger">Xóa</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="7" class="empty">Chưa có sản phẩm nào trong hệ thống</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
