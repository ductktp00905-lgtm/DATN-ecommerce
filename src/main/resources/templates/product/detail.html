<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <a th:href="@{/products}">&larr; Quay lại danh sách</a>

        <div style="max-width:500px; margin-top:16px">
            <img th:if="${product.imageURL != null}" th:src="${product.imageURL}"
                 style="width:100%; border-radius:10px; margin-bottom:16px">

            <h2 th:text="${product.name}"></h2>
            <p th:text="${product.description}"></p>
            <p class="price"><span th:text="${product.price}"></span> đ</p>
            <p>Danh mục: <span th:text="${product.category.categoryName}"></span></p>
            <p>Còn lại: <span th:text="${product.stock}"></span> sản phẩm</p>

            <form th:action="@{/cart/add}" method="post" style="margin-top:16px">
                <input type="hidden" name="productId" th:value="${product.productID}">
                <label>Số lượng:</label>
                <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                <button type="submit">Thêm vào giỏ hàng</button>
            </form>

            <a th:href="@{/reviews(productId=${product.productID})}"
               style="display:inline-block; margin-top:12px; padding:10px 16px;
                      background:#0d6efd; color:white; text-decoration:none;
                      border-radius:6px;">
                ⭐ Xem đánh giá và viết nhận xét
            </a>

            <!-- SỬA: khối yêu thích mới -->
            <p th:if="${successMessage}" th:text="${successMessage}" style="color:#16a34a; margin-top:10px"></p>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/wishlist/toggle/{productId}(productId=${product.productID})}"
                  method="post">
                <input type="hidden" name="returnTo" th:value="'/products/' + ${product.productID}">
                <button type="submit"
                        th:text="${inWishlist} ? '💔 Bỏ yêu thích' : '❤️ Thêm vào yêu thích'">❤️ Thêm vào yêu thích</button>
            </form>
            <p sec:authorize="!isAuthenticated()" style="margin-top:10px">
                <a th:href="@{/auth/login}">Đăng nhập</a> để thêm vào yêu thích
            </p>

        </div>
    </div>

    <section th:if="${not #lists.isEmpty(relatedProducts)}"
             style="margin-top: 40px;">
        <h2>Sản phẩm liên quan</h2>

        <div class="product-grid">
            <div class="product-card"
                 th:each="item : ${relatedProducts}">

                <img th:if="${item.imageURL != null}"
                     th:src="${item.imageURL}"
                     th:alt="${item.name}"
                     style="width: 100%;">

                <h3 th:text="${item.name}"></h3>

                <p class="price">
                    <span th:text="${item.price}"></span> đ
                </p>

                <a th:href="@{/products/{id}(id=${item.productID})}">
                    Xem chi tiết →
                </a>
            </div>
        </div>
    </section>

</body>
</html>
