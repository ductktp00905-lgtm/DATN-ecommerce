<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
</head>
<body>
   
<div th:replace="~{layout/header :: header}"></div>

    <div class="container">

        <!-- SẢN PHẨM BÁN CHẠY -->
        <section class="best-selling"
         th:if="${bestSellingProducts != null and !#lists.isEmpty(bestSellingProducts)}">

    <h2>🔥 Sản phẩm bán chạy</h2>

    <div class="product-grid">
        <div class="product-card"
             th:each="item : ${bestSellingProducts}">

            <!-- HÌNH ẢNH SẢN PHẨM -->
            <img th:if="${item.imageURL != null and item.imageURL != ''}"
                 th:src="${item.imageURL}"
                 th:alt="${item.name}"
                 style="width:100%; height:160px; object-fit:cover; border-radius:8px; margin-bottom:12px">

            <div th:unless="${item.imageURL != null and item.imageURL != ''}"
                 style="width:100%; height:160px; background:#f3f4f6; border-radius:8px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:13px">
                Chưa có ảnh
            </div>

            <!-- THÔNG TIN SẢN PHẨM -->
            <h3 th:text="${item.name}"></h3>

            <p th:text="${item.description}"></p>

            <p class="price">
                <span th:text="${item.price}"></span> đ
            </p>

            <p>
                Còn lại: <span th:text="${item.stock}"></span>
            </p>

            <a th:href="@{/products/{id}(id=${item.productID})}">
                Xem chi tiết →
            </a>

        </div>
    </div>
</section>
        <h2>Sản phẩm</h2>

        <!-- BỘ LỌC -->
        <form th:action="@{/products}" method="get">
            <input type="text" name="keyword"
                   th:value="${keyword}"
                   placeholder="Tìm sản phẩm...">

            <select name="categoryId">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.categoryID}"
                        th:text="${cat.categoryName}"
                        th:selected="${cat.categoryID == selectedCategoryId}">
                </option>
            </select>

            <input type="number" name="minPrice"
                   min="0" step="1000"
                   th:value="${minPrice}"
                   placeholder="Giá từ (đ)">

            <input type="number" name="maxPrice"
                   min="0" step="1000"
                   th:value="${maxPrice}"
                   placeholder="Giá đến (đ)">

            <button type="submit">Lọc</button>
            <a th:href="@{/products}">Xóa lọc</a>
        </form>

        <br>

        <!-- THÔNG BÁO KHÔNG CÓ SẢN PHẨM -->
        <div th:if="${#lists.isEmpty(products)}">
            <p>Không có sản phẩm nào.</p>
        </div>

        <!-- DANH SÁCH TẤT CẢ SẢN PHẨM -->
        <div class="product-grid">
            <div class="product-card" th:each="product : ${products}">

                <img th:if="${product.imageURL != null}"
                     th:src="${product.imageURL}"
                     style="width:100%; height:160px; object-fit:cover; border-radius:8px; margin-bottom:12px">

                <div th:unless="${product.imageURL != null}"
                     style="width:100%; height:160px; background:#f3f4f6; border-radius:8px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:13px">
                    Chưa có ảnh
                </div>

                <h3 th:text="${product.name}"></h3>

                <p th:text="${product.description}"></p>

                <p class="price">
                    <span th:text="${product.price}"></span> đ
                </p>

                <p>
                    Còn lại:
                    <span th:text="${product.stock}"></span>
                </p>

                <a th:href="@{/products/{id}(id=${product.productID})}">
                    Xem chi tiết →
                </a>
            </div>
        </div>

    </div>


</body>
</html>
