<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 — Lỗi máy chủ | FlareHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="main-content">
        <div class="container">
            <div class="error-page">
                <div class="error-code" style="color: var(--warning);">500</div>
                <h1 class="error-title">Hệ thống đang gặp sự cố</h1>
                <p class="error-desc">
                    Đã xảy ra lỗi nội bộ máy chủ khi xử lý yêu cầu của bạn. Đội ngũ kỹ thuật FlareHub đang kiểm tra và khắc phục.
                </p>
                <div>
                    <a th:href="@{/products}" class="btn btn-primary">
                        <span>Quay lại trang sản phẩm</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
