<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản của tôi</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .card { background:#fff; border-radius:12px; padding:20px 24px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
        .card h3 { margin-top:0; }
        .card .row { margin-bottom:12px; }
        .card label { display:block; font-weight:600; margin-bottom:4px; font-size:14px; }
        .card input, .card textarea { width:100%; padding:9px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; box-sizing:border-box; }
        .card button { padding:9px 18px; border:0; border-radius:8px; background:var(--primary); color:#fff; cursor:pointer; font-size:14px; }
        .card button.danger { background:#b91c1c; }
        .card button.plain { background:#e5e7eb; color:#111827; }
        .inline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .inline input { width:160px; }
    </style>
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container" style="max-width:720px">
        <h2>Tài khoản của tôi</h2>

        <p th:if="${successMessage}" th:text="${successMessage}" class="alert-success"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert-error"></p>

        <!-- Thông tin cá nhân -->
        <div class="card">
            <h3>Thông tin cá nhân</h3>
            <form th:action="@{/profile/update}" method="post">
                <div class="row">
                    <label>Tên đăng nhập</label>
                    <input type="text" th:value="${user.username}" disabled>
                </div>
                <div class="row">
                    <label>Họ tên</label>
                    <input type="text" name="fullName" th:value="${user.fullName}" required>
                </div>
                <div class="row">
                    <label>Số điện thoại</label>
                    <input type="text" name="phone" th:value="${user.phone}" placeholder="0912345678">
                </div>
                <div class="row">
                    <label>Email</label>
                    <input type="email" name="email" th:value="${user.email}" required>
                </div>
                <button type="submit">Lưu thay đổi</button>
            </form>
        </div>

        <!-- Xác minh -->
        <div class="card">
            <h3>Xác minh liên hệ</h3>

            <div class="row">
                <label>Email: <span th:text="${user.email}"></span>
                                        <span th:if="${user.phone != null and user.phoneVerified == true}" class="badge badge-completed">Đã xác minh</span>
                    <span th:if="${user.phone != null and user.phoneVerified != true}" class="badge badge-pending">Chưa xác minh</span>
                </label>
                <div class="inline" th:if="${user.phone != null and user.phoneVerified != true}">
                    <form th:action="@{/profile/verify/email/send}" method="post">
                        <button type="submit" class="plain">Gửi mã</button>
                    </form>
                    <form th:action="@{/profile/verify/email/confirm}" method="post" class="inline">
                        <input type="text" name="code" placeholder="Nhập mã 6 số" maxlength="6" required>
                        <button type="submit">Xác nhận</button>
                    </form>
                </div>
            </div>

            <div class="row">
                <label>Số điện thoại: <span th:text="${user.phone != null} ? ${user.phone} : '(chưa có)'"></span>
                <span th:if="${user.phone != null and user.phoneVerified == true}" class="badge badge-completed">Đã xác minh</span>                    
                <span th:if="${user.phone != null and !user.phoneVerified}" class="badge badge-pending">Chưa xác minh</span>
                </label>
                <div class="inline" th:if="${user.phone != null and !user.phoneVerified}">
                    <form th:action="@{/profile/verify/phone/send}" method="post">
                        <button type="submit" class="plain">Gửi mã</button>
                    </form>
                    <form th:action="@{/profile/verify/phone/confirm}" method="post" class="inline">
                        <input type="text" name="code" placeholder="Nhập mã 6 số" maxlength="6" required>
                        <button type="submit">Xác nhận</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Đổi mật khẩu -->
        <div class="card">
            <h3>Đổi mật khẩu</h3>
            <form th:action="@{/profile/password}" method="post">
                <div class="row">
                    <label>Mật khẩu hiện tại</label>
                    <input type="password" name="currentPassword" required>
                </div>
                <div class="row">
                    <label>Mật khẩu mới (tối thiểu 6 ký tự)</label>
                    <input type="password" name="newPassword" required>
                </div>
                <div class="row">
                    <label>Nhập lại mật khẩu mới</label>
                    <input type="password" name="confirmPassword" required>
                </div>
                <button type="submit">Đổi mật khẩu</button>
            </form>
        </div>

        <!-- Yêu cầu xóa tài khoản -->
        <div class="card" th:if="${user.role != 'ADMIN'}">
            <h3>Yêu cầu xóa tài khoản</h3>

            <div th:if="${user.deletionRequested}">
                <p class="alert-error">
                    Bạn đã gửi yêu cầu xóa tài khoản lúc
                    <b th:text="${#temporals.format(user.deletionRequestedDate, 'dd/MM/yyyy HH:mm')}"></b>.
                    Quản trị viên sẽ xử lý yêu cầu này.
                </p>
                <form th:action="@{/profile/delete-cancel}" method="post">
                    <button type="submit" class="plain">Hủy yêu cầu</button>
                </form>
            </div>

            <form th:unless="${user.deletionRequested}" th:action="@{/profile/delete-request}" method="post"
                  onsubmit="return confirm('Bạn chắc chắn muốn gửi yêu cầu xóa tài khoản?')">
                <div class="row">
                    <label>Lý do (không bắt buộc)</label>
                    <textarea name="reason" rows="3" maxlength="500"></textarea>
                </div>
                <div class="row">
                    <label>Nhập mật khẩu để xác nhận</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="danger">Gửi yêu cầu xóa</button>
            </form>
        </div>
    </div>
</body>
</html>
