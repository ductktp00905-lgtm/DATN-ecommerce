<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <a th:href="@{/products}">&larr; Tiếp tục mua sắm</a>
        <h2>Giỏ hàng của bạn</h2>

        <div th:if="${cart.items.isEmpty()}">
            <p>Giỏ hàng đang trống.</p>
        </div>

        <table th:unless="${cart.items.isEmpty()}">
            <tr>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
                <th>Hành động</th>
            </tr>
            <tr th:each="entry : ${cart.items}">
                <td th:text="${entry.value.productName}"></td>
                <td th:text="${entry.value.price}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" style="display:inline">
                        <input type="hidden" name="productId" th:value="${entry.key}">
                        <input type="number" name="quantity" th:value="${entry.value.quantity}" min="1" style="width:60px">
                        <button type="submit">Cập nhật</button>
                    </form>
                </td>
                <td th:text="${entry.value.subTotal}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post" style="display:inline">
                        <input type="hidden" name="productId" th:value="${entry.key}">
                        <button type="submit">Xóa</button>
                    </form>
                </td>
            </tr>
        </table>

        <h3 th:unless="${cart.items.isEmpty()}">
            Tổng cộng: <span th:text="${cart.totalAmount}"></span> đ
        </h3>

        <a th:unless="${cart.items.isEmpty()}" th:href="@{/orders/checkout}">
            <button>Tiến hành đặt hàng</button>
        </a>
    </div>
</body>
</html>
