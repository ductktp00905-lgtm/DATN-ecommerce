<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kết quả thanh toán — FlareHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="main-content">
        <div class="container" style="padding-top: 24px; padding-bottom: 48px; max-width: 640px;">
            <div class="card" style="text-align: center; padding: 48px 24px;">
                <div style="font-size: 4rem; margin-bottom: 16px;" th:text="${success} ? '✅' : '❌'">✅</div>
                <h2 th:text="${success} ? 'Thanh toán thành công' : 'Thanh toán thất bại'">Kết quả</h2>
                <p style="color: var(--text-muted); margin: 12px 0 8px;" th:text="${message}"></p>
                <p th:if="${orderId != null}" style="font-weight: 600;" th:text="'Mã đơn hàng: #' + ${orderId}"></p>
                <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                    <a th:href="@{/orders/history}" class="btn btn-primary"><span>Xem đơn hàng của tôi</span></a>
                    <a th:href="@{/products}" class="btn btn-outline"><span>Tiếp tục mua sắm</span></a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
