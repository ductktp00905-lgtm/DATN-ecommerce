<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử đơn hàng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>
    <div class="container">
        <h2>Đơn hàng của tôi</h2>

        <p th:if="${#lists.isEmpty(orders)}">Bạn chưa có đơn hàng nào.</p>

        <table th:unless="${#lists.isEmpty(orders)}">
            <tr>
                <th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderID}"></td>
                <td th:text="${order.orderDate}"></td>
                <td th:text="${order.totalAmount}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${order.status == 'PENDING'} ? 'badge-pending' : (${order.status == 'SHIPPING'} ? 'badge-shipping' : (${order.status == 'COMPLETED'} ? 'badge-completed' : 'badge-cancelled'))"
                          th:text="${order.status}"></span>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
