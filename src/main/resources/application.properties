# ===== Server =====
server.port=8080

# ===== Datasource SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ECommerceDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Logging (tùy chọn, dễ debug lúc dev) =====
logging.level.org.hibernate.SQL=debug

# ===== Đánh giá sản phẩm =====
app.review.edit-window-minutes=15
app.review.recommend-min-rating=4.0
app.review.recommend-min-reviews=1

# ===== VNPay Sandbox =====
vnpay.tmn-code=THAY_BANG_TMN_CODE
vnpay.hash-secret=THAY_BANG_HASH_SECRET
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/payment/vnpay-return