# ===== Server =====
server.port=8080

# ===== Datasource SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ECommerceDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===== Encoding =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# ===== Logging (tùy chọn, dễ debug lúc dev) =====
logging.level.org.hibernate.SQL=debug

# ===== Đánh giá sản phẩm =====
app.review.edit-window-minutes=15
app.review.recommend-min-rating=4.0
app.review.recommend-min-reviews=1

