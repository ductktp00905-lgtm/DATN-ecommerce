  <rect x="440" y="75" width="75" height="24" rx="4" fill="#000" opacity="0.7"/>
  <text x="477" y="91" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#e2e8f0" text-anchor="middle">google tv</text>
